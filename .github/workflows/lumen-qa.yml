name: Lumen Fold — Build & Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate real 3D module syntax
        run: node --check src/lumen3d.js
      - name: Build Vite production bundle
        run: npm run build
      - name: Install browser harness
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Desktop/mobile interaction smoke test
        run: |
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4188 > /tmp/lumen-vite.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async()=>{
            const path=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fs.existsSync(p));
            if(!path)throw Error('Chromium unavailable');
            const browser=await chromium.launch({headless:true,executablePath:path,args:['--no-sandbox','--disable-webgl','--disable-software-rasterizer']});
            const errors=[];
            try{
              for(const dims of [{width:1440,height:900},{width:390,height:844}]){
                const p=await browser.newPage({viewport:dims,isMobile:dims.width<500,hasTouch:dims.width<500});
                p.on('pageerror',error=>errors.push(dims.width+': '+error.message));
                await p.goto('http://127.0.0.1:4188/',{waitUntil:'domcontentloaded'});
                await p.locator('.home-headline h1').waitFor({state:'visible'});
                const heading=await p.locator('.home-headline h1').innerText();
                if(!heading.includes('LUMEN')||!heading.includes('FOLD'))throw Error('LUMEN FOLD title not visible');
                await p.getByRole('button',{name:'WORK',exact:true}).click();
                await p.locator('.project-list button').first().waitFor({state:'visible'});
                await p.locator('.project-list button').first().click();
                await p.locator('.project-modal').waitFor({state:'visible'});
                await p.locator('.modal-heading button').click();
                await p.locator('.project-modal').waitFor({state:'hidden'});
                await p.getByRole('button',{name:'ABOUT',exact:true}).click();
                await p.getByText("I'm Harnarayan", {exact:false}).waitFor({state:'visible'});
                await p.getByRole('button',{name:'CONTACT',exact:true}).click();
                await p.getByText('SEND AN INQUIRY',{exact:false}).waitFor({state:'visible'});
                await p.locator('.wordmark').click();
                await p.locator('.home-headline h1').waitFor({state:'visible'});
                await p.screenshot({path:'lumen-'+dims.width+'.png'});
                await p.close();
              }
              if(errors.length)throw Error('Browser errors: '+errors.join('; '));
              console.log('Desktop and mobile navigation, gallery, modal and fallback PASSED');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Capture visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-fold-desktop-mobile
          path: |
            lumen-1440.png
            lumen-390.png
          if-no-files-found: ignore
  gpu-render-probe:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Check real Three.js rendering in software WebGL Chromium
        continue-on-error: true
        run: |
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4188 > /tmp/lumen-gpu.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(x=>fs.existsSync(x));
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--enable-webgl','--enable-unsafe-swiftshader','--use-angle=swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const errors=[];
              page.on('pageerror',e=>errors.push('JS: '+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              await page.goto('http://127.0.0.1:4188/',{waitUntil:'domcontentloaded'});
              await page.locator('.home-headline h1').waitFor({state:'visible'});
              try{await page.locator('.lumen-canvas.ready').waitFor({timeout:23000});}
              catch(e){console.log('WebGL did not initialize within runner GPU budget')}
              const report=await page.evaluate(()=>({
                canvasReady:document.querySelector('.lumen-canvas')?.classList.contains('ready'),
                status:document.querySelector('.footer-status span')?.textContent,
                renderer:document.querySelector('canvas.lumen-canvas')?.getAttribute('width'),
                bodyBackground:getComputedStyle(document.querySelector('.lumen-site')).backgroundColor
              }));
              console.log('LUMEN WEBGL PROBE',JSON.stringify(report));
              console.log('BROWSER ERRORS',JSON.stringify(errors.slice(-12)));
              if(report.canvasReady){
                await page.mouse.move(930,390);
                await page.waitForTimeout(500);
                await page.screenshot({path:'lumen-real-webgl.png',timeout:18000});
              }
              if(errors.some(e=>e.includes('Uncaught')))throw Error(errors.join('\n'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload actual WebGL render preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-live-webgl-render
          path: lumen-real-webgl.png
          if-no-files-found: ignore
