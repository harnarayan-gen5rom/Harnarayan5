name: Lumen Fold — Build & Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate real 3D module syntax
        run: node --check src/lumen3d.js
      - name: Build Vite production bundle
        run: npm run build
      - name: Install browser harness
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Desktop/mobile interaction smoke test
        run: |
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4188 > /tmp/lumen-vite.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async()=>{
            const path=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fs.existsSync(p));
            if(!path)throw Error('Chromium unavailable');
            const browser=await chromium.launch({headless:true,executablePath:path,args:['--no-sandbox','--disable-webgl','--disable-software-rasterizer']});
            const errors=[];
            try{
              for(const dims of [{width:1440,height:900},{width:1024,height:768},{width:820,height:1180},{width:560,height:760},{width:430,height:932},{width:390,height:844},{width:360,height:740},{width:320,height:720},{width:320,height:600}]){
                const p=await browser.newPage({viewport:dims,isMobile:dims.width<500,hasTouch:dims.width<500});
                p.on('pageerror',error=>errors.push(dims.width+': '+error.message));
                await p.goto('http://127.0.0.1:4188/',{waitUntil:'domcontentloaded'});
                await p.locator('.home-headline h1').waitFor({state:'visible'});
                const heading=await p.locator('.home-headline h1').innerText();
                if(!heading.includes('LUMEN')||!heading.includes('FOLD'))throw Error('LUMEN FOLD title not visible');
                const layout=async phase=>p.evaluate((phase)=>{
                  const selectors=phase==='hero'?
                    ['.lumen-header','.home-headline','.lumen-footer']:
                    ['.lumen-header','.lumen-info.info-visible','.lumen-footer'];
                  const rects={};
                  for(const sel of selectors){
                    const el=document.querySelector(sel);if(!el)continue;
                    const css=getComputedStyle(el);
                    if(css.display==='none'||css.visibility==='hidden')continue;
                    const r=el.getBoundingClientRect();
                    rects[sel]={top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height};
                  }
                  const overlap=(a,b)=>{
                    const x=rects[a],y=rects[b];
                    return !!(x&&y&&Math.min(x.right,y.right)-Math.max(x.left,y.left)>4&&Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top)>4);
                  };
                  const mid=phase==='hero'?'.home-headline':'.lumen-info.info-visible';
                  const collisions=[['.lumen-header',mid],[mid,'.lumen-footer']]
                    .filter(([a,b])=>overlap(a,b)).map(z=>z.join(' <> '));
                  const hidden=phase==='gallery'?getComputedStyle(document.querySelector('.home-headline')).visibility==='hidden':
                    getComputedStyle(document.querySelector('.lumen-info')).visibility==='hidden';
                  if(!hidden)collisions.push('hidden view overlapping active section');
                  const section=document.querySelector('.lumen-site').getBoundingClientRect();
                  if(rects[mid]&&rects[mid].right>innerWidth+3)collisions.push('active content right cropped');
                  return {phase,viewport:[innerWidth,innerHeight],heroHeight:section.height,rects,collisions,
                    scrollWidth:document.documentElement.scrollWidth};
                },phase);
                const hero=await layout('hero');
                console.log('LUMEN HERO LAYOUT',dims.width,JSON.stringify(hero));
                if(hero.collisions.length)throw Error('Hero overlap '+JSON.stringify(hero.collisions));
                await p.locator('.lumen-unfold-secondary').click();
                await p.locator('.lumen-info.info-visible .project-list button').first().waitFor({state:'visible'});
                const gallery=await layout('gallery');
                console.log('LUMEN GALLERY LAYOUT',dims.width,JSON.stringify(gallery));
                if(gallery.collisions.length)throw Error('Gallery overlap '+JSON.stringify(gallery.collisions));
                await p.screenshot({path:'lumen-gallery-'+dims.width+'.png'});
                await p.locator('.lumen-info.info-visible .return-link').click();
                await p.locator('.home-headline.visible').waitFor({state:'visible'});
                // Actual site navigation and public portfolio content, including resume.
                await p.locator('.primary-navigation a[href="#work"]').click();
                await p.locator('#work .pf-project').first().waitFor({state:'visible'});
                const projectCount=await p.locator('#work .pf-project').count();
                if(projectCount<9)throw Error('Project catalog not rendered');
                await p.locator('#work .pf-project').first().click();
                await p.locator('.pf-modal [role="dialog"]').waitFor({state:'visible'});
                await p.locator('.pf-modal-top button').click();
                await p.locator('.pf-modal').waitFor({state:'hidden'});
                await p.locator('#work .pf-filter-list button').filter({hasText:'Graphic design'}).click();
                await p.locator('#work .pf-project').first().waitFor({state:'visible'});
                await p.locator('#experience').scrollIntoViewIfNeeded();
                await p.locator('.pf-job').first().waitFor({state:'visible'});
                if(await p.locator('.pf-job').count()!==3)throw Error('Resume experience timeline missing');
                await p.locator('#about').scrollIntoViewIfNeeded();
                await p.getByText('Indira Gandhi National Open University', {exact:false}).waitFor({state:'visible'});
                await p.locator('#skills').scrollIntoViewIfNeeded();
                await p.getByText('After Effects', {exact:true}).first().waitFor({state:'visible'});
                await p.locator('#contact').scrollIntoViewIfNeeded();
                await p.locator('.pf-email').waitFor({state:'visible'});
                await p.locator('.pf-email').evaluate(el=>{if(!el.href.startsWith('mailto:'))throw Error('Email link invalid')});
                const viewport=await p.evaluate(()=>({
                  innerWidth:window.innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  workCount:document.querySelectorAll('.pf-project').length,
                  sections:['work','experience','about','skills','contact'].every(id=>!!document.getElementById(id)),
                  resume:!!document.querySelector('a[href$="harnarayan-resume.pdf"]')
                }));
                console.log('PORTFOLIO RESPONSIVE CHECK',dims.width,JSON.stringify(viewport));
                if(viewport.scrollWidth>viewport.innerWidth+3)throw Error('Horizontal overflow '+JSON.stringify(viewport));
                if(!viewport.sections||!viewport.resume)throw Error('Sections or resume missing');
                await p.locator('.pf-brand').click();
                await p.locator('.home-headline h1').waitFor({state:'visible'});
                await p.screenshot({path:'lumen-'+dims.width+'.png'});
                await p.close();
              }
              if(errors.length)throw Error('Browser errors: '+errors.join('; '));
              console.log('Desktop, tablet and mobile portfolio, filters, resume timeline, dialogs and overflow PASSED');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Capture visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-fold-desktop-mobile
          path: |
            lumen-1440.png
            lumen-1024.png
            lumen-820.png
            lumen-560.png
            lumen-430.png
            lumen-390.png
            lumen-360.png
            lumen-320.png
            lumen-gallery-*.png
          if-no-files-found: ignore
  gpu-render-probe:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Check real Three.js rendering in software WebGL Chromium
        continue-on-error: true
        run: |
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4188 > /tmp/lumen-gpu.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(x=>fs.existsSync(x));
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--enable-webgl','--enable-unsafe-swiftshader','--use-angle=swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const errors=[];
              page.on('pageerror',e=>errors.push('JS: '+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              await page.goto('http://127.0.0.1:4188/',{waitUntil:'domcontentloaded'});
              await page.locator('.home-headline h1').waitFor({state:'visible'});
              try{await page.locator('.lumen-canvas.ready').waitFor({timeout:23000});}
              catch(e){console.log('WebGL did not initialize within runner GPU budget')}
              const report=await page.evaluate(()=>({
                canvasReady:document.querySelector('.lumen-canvas')?.classList.contains('ready'),
                status:document.querySelector('.footer-status span')?.textContent,
                renderer:document.querySelector('canvas.lumen-canvas')?.getAttribute('width'),
                bodyBackground:getComputedStyle(document.querySelector('.lumen-site')).backgroundColor
              }));
              console.log('LUMEN WEBGL PROBE',JSON.stringify(report));
              console.log('BROWSER ERRORS',JSON.stringify(errors.slice(-12)));
              if(report.canvasReady){
                await page.mouse.move(930,390);
                await page.waitForTimeout(350);
                // Freeze renderer before readback; SwiftShader cannot reliably capture at full animated FPS.
                await page.evaluate(()=>{
                  Object.defineProperty(document,'hidden',{configurable:true,get:()=>true});
                  document.dispatchEvent(new Event('visibilitychange'));
                });
                await page.screenshot({path:'lumen-real-webgl.png',timeout:30000});
              }
              if(errors.some(e=>e.includes('Uncaught')))throw Error(errors.join('\n'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload actual WebGL render preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-live-webgl-render
          path: lumen-real-webgl.png
          if-no-files-found: ignore
